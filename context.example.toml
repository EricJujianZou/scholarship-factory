# Your material, for matching and drafting later. Internship-flavored: the
# corpus now leans intern listings (Simplify + co.), so this template asks for
# what internship applications and recruiters actually check. Scholarships
# still match off the same file — keep any award/essay entries you have.
#
#   cp context.example.toml context.toml     # context.toml is gitignored
#   uv run sf context import context.toml    # re-run any time; matches on title
#
# This file holds PERSONAL DATA. It and the database are gitignored on purpose.
# Do not commit either, and do not paste them into a chat.
#
# Every section is optional and repeatable. Fill in what you have; more detail
# means less rewriting later. `title` is the identity, so re-importing an edited
# entry updates it instead of creating a second copy.

# What ranking filters and sorts on. The same fields as the dashboard's profile
# editor; whichever you edit last wins. Omit the whole section to leave the
# stored profile alone.
#
# `region` and `education_level` drive the deterministic hard filters, so they
# only work on values the filters recognise:
#   region:          Canada | USA | EU | UK  (or a member state: Germany, France, ...)
#   education_level: high school | undergraduate | graduate  (masters/PhD -> graduate)
# Anything unrecognised is treated as unstated, which excludes nothing.
#
# `field_of_study`, `tags` and `bio` are free text - they go to the LLM relevance
# ranker, which is what decides *how well* something fits. For internships the
# ranker leans hardest on target roles, work authorization, and which terms you
# can actually work - say those plainly in the bio.
[profile]
region = "Canada"
education_level = "undergraduate"
field_of_study = "computer science"
tags = ["software engineering intern", "machine learning", "backend"]
bio = """
Two or three sentences, the way you'd answer "tell me about yourself" to a
recruiter: what you study, what roles you're hunting (SWE / ML / data / hardware),
which terms you're available (e.g. Summer 2027, Fall 2026 co-op), and where you
can work. Work authorization matters most - many US listings can't sponsor.
"""

# Plain answers to the questions applications and recruiters ask.
[[fact]]
title = "citizenship"
body = "Canadian citizen"

[[fact]]
title = "work authorization"
body = "Authorized to work in Canada. US: requires sponsorship (or: eligible for J-1/co-op work permit - state what's actually true)."

[[fact]]
title = "location"
body = "Waterloo, ON. Open to relocation / remote."

[[fact]]
title = "availability"
body = "Co-op terms available: e.g. Summer 2027 (May-Aug), Fall 2027. Earliest start: YYYY-MM."

[[education]]
title = "BASc Computer Science, University of Waterloo"
body = "Expected graduation 20XX. Cumulative average XX%. Relevant coursework: ..."
started = "20XX-09"
ended = "20XX-04"
tags = ["current"]

# Internships, jobs, research positions - what recruiters read first.
[[experience]]
title = "Software Engineering Intern, Example Corp"
body = "What you built, the stack, the scale, and what changed because you were there. Numbers beat adjectives."
started = "20XX-05"
ended = "20XX-08"
tags = ["internship", "backend"]

[[project]]
title = "Example Project"
body = "What it does, why you built it, what you learned, any users or results."
url = "https://github.com/you/example"
tags = ["side-project"]

[[award]]
title = "Example Hackathon Win / Entrance Scholarship"
body = "What it was for, how competitive, what it recognized."
started = "20XX"

# Past written answers - cover letters, "why us" paragraphs, scholarship essays.
# The point is reuse: a new prompt close to an old one starts here rather than
# from nothing. Paste the real text, not a summary.
[[essay]]
title = "Why Example Corp - cover letter"
body = """
Paste the full text here.
"""
tags = ["cover-letter"]

[[reference]]
title = "Jane Example, Engineering Manager"
body = "Manager during my 20XX internship at Example Corp. Agreed to be a reference."
url = "mailto:reference@example.com"

[[document]]
title = "Resume"
body = "The current master copy, and which variant (SWE/ML) it is."
url = "file:///C:/path/to/resume.pdf"

[[document]]
title = "Official transcript"
body = "Where it lives and how to request it, so you are not hunting at 2am."
url = "file:///C:/path/to/transcript.pdf"
