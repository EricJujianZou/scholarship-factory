<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGMI theme explorations — gallery</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #1a1a1a; color: #eee;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 10px 14px; display: flex; gap: 8px; align-items: center;
           flex-wrap: wrap; border-bottom: 1px solid #333; }
  header strong { margin-right: 8px; }
  button { font: inherit; padding: 8px 14px; background: #2a2a2a; color: #ddd;
           border: 1px solid #444; cursor: pointer; border-radius: 6px; }
  button.active { background: #eee; color: #111; border-color: #eee; }
  button.mode { margin-left: auto; }
  #note { padding: 6px 14px; color: #aaa; font-size: 13px; border-bottom: 1px solid #333; }
  main { flex: 1; display: flex; justify-content: center; align-items: stretch;
         background: #111; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; background: #fff; }
  main.phone iframe { width: 390px; margin: 12px auto; border: 1px solid #444;
                      border-radius: 12px; }
</style>
</head>
<body>
<header>
  <strong>UGMI themes</strong>
  <button data-f="tactile-calm-v2.html" data-n="V2 synthesis after owner review: calm bones + tactile cards, compressed hero and filters, contact wedge at the Apply moment, real cited stats, template + Monday email as the free decline path.">v2 hybrid</button>
  <button data-f="institutional-calm.html" data-n="Wealthsimple grammar: bone, forest green, medium weights. Research favorite for payment trust; least distinctive.">calm</button>
  <button data-f="data-brutal.html" data-n="Swiss print sheet: hairlines, mono data, giant 1,427. The audience's native GitHub-list trust language; hardest edge.">brutal</button>
  <button data-f="editorial-zine.html" data-n="Ink + cream + terracotta broadsheet, pulse strip as dateline. Most ownable as a one-person publication.">zine</button>
  <button data-f="tactile-consumer.html" data-n="Duolingo pressable grammar, gamification stripped. Warmest; riskiest against the grift-radar near payment.">tactile</button>
  <button data-f="terminal-dark.html" data-n="Telemetry dark, green accent, receipt-style checkout. CS-native wildcard; research flags dark near money.">terminal</button>
  <button class="mode" id="mode">phone view</button>
</header>
<div id="note"></div>
<main id="main"><iframe id="frame" src="tactile-calm-v2.html"></iframe></main>
<script>
  const tabs = document.querySelectorAll('button[data-f]');
  const frame = document.getElementById('frame');
  const note = document.getElementById('note');
  const main = document.getElementById('main');
  const mode = document.getElementById('mode');
  tabs.forEach(b => b.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    frame.src = b.dataset.f;
    note.textContent = b.dataset.n;
  }));
  tabs[0].classList.add('active');
  note.textContent = tabs[0].dataset.n;
  mode.addEventListener('click', () => {
    main.classList.toggle('phone');
    mode.textContent = main.classList.contains('phone') ? 'desktop view' : 'phone view';
  });
</script>
</body>
</html>
