# Seed sources for `sf source --seeds seeds.toml`.
#
# type = "url"      -> fetched as-is (listing or detail page)
# type = "reddit"   -> r/<name>, via reddit's public listing JSON
# type = "devpost"  -> a devpost URL, fetched as-is
# type = "simplify" -> a SimplifyJobs listings.json URL, parsed deterministically
#                      (no LLM calls, ~1,500 live intern rows; deadline stays empty
#                      because Simplify does not publish one)
# type = "vansh"    -> a vanshb03 listings.json URL (Simplify-style schema subset),
#                      parsed deterministically, no LLM calls
# type = "zshah"    -> a zshah101 docs/api/jobs.json URL (crawler board; the only
#                      one of the three that publishes pay), deterministic, no LLM
# type = "instagram" / "x" -> accepted but skipped (auth wall, not yet supported)
#
# Every fetched page costs one LLM call, and a listing page can traverse up to
# --page-cap more. Start with a small cap and raise it once the yield looks good.
#
# Probed 2026-08-01 with the polite fetcher; only sources that actually return
# content are enabled. Known-blocked (do not re-add without a fix):
#   scholarshipscanada.com, scholarshipportal.com  -> 403 bot wall
#   scholartree.ca                                 -> robots.txt disallow
#   reddit.com/r/*/new.json                        -> robots.txt disallow

# Verified 2026-08-07: SimplifyJobs renamed Summer2026-Internships to
# Summer2027-Internships (GitHub 301s the old name; both raw URLs serve the
# byte-identical listings.json). One seed on the canonical name — a second
# seed on the old URL would just fetch the same 10.9 MB file twice.
[[seeds]]
type = "simplify"
value = "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"
label = "Simplify internships (community board, all terms)"

[[seeds]]
type = "vansh"
value = "https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json"
label = "Vansh Summer 2027 internships (community board)"

# Verified 2026-08-08: 161 open roles, 37 of them with a stated salary — the
# only community board of the three that publishes pay. Its own GitHub Actions
# re-crawl the underlying ATS boards through the day, so polling it daily is
# what makes the store grow without us crawling those boards ourselves.
# `docs/api/jobs.json` is the open roles; `data/jobs.json` is the closed archive
# too — don't switch to it.
[[seeds]]
type = "zshah"
value = "https://raw.githubusercontent.com/zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships/main/docs/api/jobs.json"
label = "zshah101 automated internship crawler (Summer 2027 / Fall 2026)"

[[seeds]]
type = "url"
value = "https://uwaterloo.ca/student-awards-financial-aid/"
label = "waterloo awards directory"

[[seeds]]
type = "url"
value = "https://opportunitiesforyouth.org/category/scholarships/"
label = "opportunities for youth - scholarships"

[[seeds]]
type = "url"
value = "https://opportunitydesk.org/"
label = "opportunity desk"

[[seeds]]
type = "url"
value = "https://devpost.com/hackathons"
label = "devpost hackathons"
enabled = false

# Auth-walled: the adapter skips these, kept to document intent.
[[seeds]]
type = "reddit"
value = "r/scholarships"
label = "r/scholarships (robots-disallowed, see above)"
enabled = false
